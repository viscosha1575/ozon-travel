services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - proxy

  postgres:
    image: postgres:16-alpine
    container_name: ozon-travel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ozon_travel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ozon_travel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ozon-travel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ozon-travel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ozon_travel}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://${DOMAIN}}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-https://${DOMAIN}}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_CHANNEL_URL: ${MAX_CHANNEL_URL:-https://max.ru/ozontravel_official}
      MAX_CHANNEL_CHAT_ID: ${MAX_CHANNEL_CHAT_ID:-}
      MAX_INTERNAL_SUBSCRIPTION_CHECK_URL: ${MAX_INTERNAL_SUBSCRIPTION_CHECK_URL:-http://max-bot:3011/internal/subscription/check}
      MAX_INTERNAL_SUBSCRIPTION_CHECK_TIMEOUT_MS: ${MAX_INTERNAL_SUBSCRIPTION_CHECK_TIMEOUT_MS:-15000}
      MAX_BOT_PUBLIC_URL: ${MAX_BOT_PUBLIC_URL:-https://max.ru/ozontravel_lenta_bot}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      TEST_PUSH_WAIT_TIMEOUT_MS: ${TEST_PUSH_WAIT_TIMEOUT_MS:-120000}
      UPLOADS_DIR: /app/uploads
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      BROADCAST_INTERNAL_TOKEN: ${BROADCAST_INTERNAL_TOKEN:-}
    volumes:
      - backend_uploads:/app/uploads
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ozon-travel-api.rule=(Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`) || Host(`admin.${DOMAIN}`)) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))
      - traefik.http.routers.ozon-travel-api.entrypoints=websecure
      - traefik.http.routers.ozon-travel-api.tls.certresolver=le
      - traefik.http.routers.ozon-travel-api.priority=100
      - traefik.http.services.ozon-travel-api.loadbalancer.server.port=3001
    networks:
      - default
      - proxy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: ozon-travel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ozon-travel.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.ozon-travel.entrypoints=websecure
      - traefik.http.routers.ozon-travel.tls.certresolver=le
      - traefik.http.services.ozon-travel.loadbalancer.server.port=80
    networks:
      - proxy

  admin:
    build:
      context: ./admin
      args:
        REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET}
        VITE_REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET}
        VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:-https://admin.${DOMAIN}}
        VITE_ALLOW_BROWSER_ADMIN: ${VITE_ALLOW_BROWSER_ADMIN:-false}
    container_name: ozon-travel-admin
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ozon-travel-admin.rule=Host(`admin.${DOMAIN}`)
      - traefik.http.routers.ozon-travel-admin.entrypoints=websecure
      - traefik.http.routers.ozon-travel-admin.tls.certresolver=le
      - traefik.http.services.ozon-travel-admin.loadbalancer.server.port=80
    networks:
      - proxy

  max-bot:
    build:
      context: ./max-bot
    container_name: ozon-travel-max-bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_BOT_MODE: ${MAX_BOT_MODE:-webhook}
      MAX_BOT_PORT: 3011
      MAX_API_REQUESTS_PER_SECOND: ${MAX_API_REQUESTS_PER_SECOND:-25}
      MAX_ATTACHMENT_CACHE_TTL_MS: ${MAX_ATTACHMENT_CACHE_TTL_MS:-86400000}
      MAX_ATTACHMENT_READY_DELAY_MS: ${MAX_ATTACHMENT_READY_DELAY_MS:-2000}
      MAX_WEBHOOK_BASE_URL: ${MAX_WEBHOOK_BASE_URL:-https://bot.${DOMAIN}}
      MAX_WEBHOOK_PATH: ${MAX_WEBHOOK_PATH:-/max/webhook}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET}
      MAX_AUTO_REGISTER_WEBHOOK: ${MAX_AUTO_REGISTER_WEBHOOK:-true}
      MAX_WEBHOOK_RETRY_MS: ${MAX_WEBHOOK_RETRY_MS:-60000}
      MAX_WEBHOOK_UPDATE_TYPES: ${MAX_WEBHOOK_UPDATE_TYPES:-}
      MAX_SUBSCRIPTION_CHECK_MODE: ${MAX_SUBSCRIPTION_CHECK_MODE:-api}
      MAX_CHANNEL_URL: ${MAX_CHANNEL_URL:-https://max.ru/ozontravel_official}
      MAX_CHANNEL_CHAT_ID: ${MAX_CHANNEL_CHAT_ID:-}
      GAME_WEBAPP_URL: ${GAME_WEBAPP_URL:-https://${DOMAIN}}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-@ozon_travel_max_support}
      GAME_API_URL: http://backend:3001
      REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET}
      REQUIRE_ENCRYPTED_REQUESTS: ${REQUIRE_ENCRYPTED_REQUESTS:-false}
      BROADCAST_INTERNAL_TOKEN: ${BROADCAST_INTERNAL_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ozon-travel-max-bot.rule=Host(`bot.${DOMAIN}`)
      - traefik.http.routers.ozon-travel-max-bot.entrypoints=websecure
      - traefik.http.routers.ozon-travel-max-bot.tls.certresolver=le
      - traefik.http.services.ozon-travel-max-bot.loadbalancer.server.port=3011
    networks:
      - default
      - proxy

  worker:
    build:
      context: ./worker
    container_name: ozon-travel-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
      max-bot:
        condition: service_started
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GAME_API_URL: http://backend:3001
      REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET}
      REQUIRE_ENCRYPTED_REQUESTS: ${REQUIRE_ENCRYPTED_REQUESTS:-false}
      MAX_INTERNAL_BROADCAST_URL: http://max-bot:3011/internal/broadcast/send
      MAX_INTERNAL_BROADCAST_DELETE_URL: http://max-bot:3011/internal/broadcast/delete
      BROADCAST_INTERNAL_TOKEN: ${BROADCAST_INTERNAL_TOKEN:-}
      GAME_WEBAPP_URL: ${GAME_WEBAPP_URL:-https://${DOMAIN}}
      DAILY_ATTEMPT_REMINDER_ENABLED: ${DAILY_ATTEMPT_REMINDER_ENABLED:-true}
      DAILY_ATTEMPT_REMINDER_CRON: ${DAILY_ATTEMPT_REMINDER_CRON:-0 0 12 * * *}
      DAILY_ATTEMPT_TIMEZONE: ${DAILY_ATTEMPT_TIMEZONE:-Europe/Moscow}
      DAILY_ATTEMPT_REMINDER_BATCH_SIZE: ${DAILY_ATTEMPT_REMINDER_BATCH_SIZE:-500}
      NOTIFICATION_SEND_CONCURRENCY: ${NOTIFICATION_SEND_CONCURRENCY:-20}
      NOTIFICATION_SEND_LIMIT_MAX: ${NOTIFICATION_SEND_LIMIT_MAX:-20}
      NOTIFICATION_SEND_LIMIT_DURATION_MS: ${NOTIFICATION_SEND_LIMIT_DURATION_MS:-1000}
      NOTIFICATION_SEND_ATTEMPTS: ${NOTIFICATION_SEND_ATTEMPTS:-5}
      NOTIFICATION_SEND_BACKOFF_MS: ${NOTIFICATION_SEND_BACKOFF_MS:-30000}
      MANUAL_PUSH_JOB_CONCURRENCY: ${MANUAL_PUSH_JOB_CONCURRENCY:-1}
      MANUAL_PUSH_SEND_CONCURRENCY: ${MANUAL_PUSH_SEND_CONCURRENCY:-20}
      MANUAL_PUSH_REVOKE_CONCURRENCY: ${MANUAL_PUSH_REVOKE_CONCURRENCY:-20}
      DAILY_ATTEMPT_REMINDER_BANNER_PATH: ${DAILY_ATTEMPT_REMINDER_BANNER_PATH:-public/banner.mp4}

networks:
  proxy:
    name: proxy

volumes:
  traefik_letsencrypt:
  postgres_data:
  redis_data:
  backend_uploads:
