services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ozon_travel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ozon_travel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ozon_travel}
      REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET:-local-dev-secret}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:3001}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:4173}
      MAX_BOT_PUBLIC_URL: ${MAX_BOT_PUBLIC_URL:-https://max.ru/ozontravel_lenta_bot}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Belgrade}
      UPLOADS_DIR: /app/uploads
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-https://ozon-travel-max.ru/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:80"

  admin:
    build:
      context: ./admin
      args:
        REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET:-local-dev-secret}
        VITE_REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET:-local-dev-secret}
        VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4174:80"

  max-bot:
    build:
      context: ./max-bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_MODE: ${MAX_BOT_MODE:-polling}
      MAX_BOT_PORT: 3011
      MAX_WEBHOOK_BASE_URL: ${MAX_WEBHOOK_BASE_URL:-}
      MAX_WEBHOOK_PATH: ${MAX_WEBHOOK_PATH:-/max/webhook}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-local-max-webhook-secret}
      MAX_AUTO_REGISTER_WEBHOOK: ${MAX_AUTO_REGISTER_WEBHOOK:-false}
      MAX_WEBHOOK_RETRY_MS: ${MAX_WEBHOOK_RETRY_MS:-60000}
      MAX_WEBHOOK_UPDATE_TYPES: ${MAX_WEBHOOK_UPDATE_TYPES:-}
      MAX_SUBSCRIPTION_CHECK_MODE: ${MAX_SUBSCRIPTION_CHECK_MODE:-api}
      MAX_CHANNEL_URL: ${MAX_CHANNEL_URL:-https://max.ru/ozontravel_official}
      MAX_CHANNEL_CHAT_ID: ${MAX_CHANNEL_CHAT_ID:-}
      GAME_WEBAPP_URL: ${GAME_WEBAPP_URL:-http://localhost:4173}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-@ozon_travel_max_support}
      GAME_API_URL: http://backend:3001
      REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET:-local-dev-secret}
      REQUIRE_ENCRYPTED_REQUESTS: ${REQUIRE_ENCRYPTED_REQUESTS:-false}
      BROADCAST_INTERNAL_TOKEN: ${BROADCAST_INTERNAL_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3011:3011"

volumes:
  postgres_data:
  backend_uploads:
